<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算数パワーアップ！</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <!-- Mobile Drag and Drop Polyfill -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/drag-drop-touch/1.0.8/DragDropTouch.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useCallback, useRef, forwardRef, useImperativeHandle } = React;

    // --- Inline SVG Icons ---
    const Star = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>);
    const ArrowLeft = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>);
    const Circle = ({ className, strokeWidth }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth || 2} strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/></svg>);
    const X = ({ className, strokeWidth }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth || 2} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
    const Award = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>);
    const Undo = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>);
    const Heart = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>);

    const playCorrectSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, ctx.currentTime); 
        gain1.gain.setValueAtTime(0.3, ctx.currentTime); gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.3);

        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.type = 'sine'; osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); 
        gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.15); gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.15); osc2.stop(ctx.currentTime + 0.45);
      } catch (e) { console.log('Audio error:', e); }
    };

    const Confetti = () => {
      const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa'];
      const pieces = Array.from({ length: 60 }).map((_, i) => ({
        id: i, left: `${Math.random() * 100}%`, animationDelay: `${1 + Math.random() * 2}s`, 
        backgroundColor: colors[Math.floor(Math.random() * colors.length)], transform: `rotate(${Math.random() * 360}deg)`,
      }));
      return (
        <div className="absolute inset-0 pointer-events-none overflow-hidden z-50">
          <style>{`@keyframes fall { 0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(120vh) rotate(720deg); opacity: 0; } } .confetti-piece { position: absolute; top: -20px; width: 12px; height: 12px; opacity: 0; animation: fall 3s linear forwards; }`}</style>
          {pieces.map(p => <div key={p.id} className="confetti-piece rounded-sm" style={{ left: p.left, backgroundColor: p.backgroundColor, animationDelay: p.animationDelay }} />)}
        </div>
      );
    };

    const Kusudama = ({ onClick }) => (
      <div className="fixed inset-0 z-[100] flex items-center justify-center animate-in fade-in duration-500 cursor-pointer pointer-events-auto" onClick={onClick}>
        <Confetti />
        <div className="relative flex flex-col items-center -mt-40 drop-shadow-2xl">
          <style>{`@keyframes swing { 0%,100% { transform: rotate(0deg); } 20% { transform: rotate(15deg); } 40% { transform: rotate(-10deg); } 60% { transform: rotate(5deg); } 80% { transform: rotate(-2deg); } } @keyframes open-left { 100% { transform: rotate(-60deg); opacity: 0;} } @keyframes open-right { 100% { transform: rotate(60deg); opacity: 0;} } @keyframes drop { 0% { height: 0; } 80% { height: 260px; } 90% { height: 230px; } 100% { height: 240px; } } .kusudama-container { animation: swing 1s ease-in-out; transform-origin: top center; } .kusu-l { animation: open-left 0.6s ease-in forwards 1s; } .kusu-r { animation: open-right 0.6s ease-in forwards 1s; } .banner { animation: drop 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards 1s; }`}</style>
          <div className="w-1 h-20 bg-gray-300"></div>
          <div className="kusudama-container relative w-32 h-32 z-10">
            <div className="kusu-l absolute left-0 w-16 h-32 overflow-hidden origin-right"><div className="absolute left-0 w-32 h-32 bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-full border-4 border-yellow-600 shadow-inner"></div></div>
            <div className="kusu-r absolute right-0 w-16 h-32 overflow-hidden origin-left"><div className="absolute right-0 w-32 h-32 bg-gradient-to-bl from-yellow-400 to-yellow-600 rounded-full border-4 border-yellow-600 shadow-inner"></div></div>
            <div className="banner absolute top-16 left-1/2 -translate-x-1/2 w-16 bg-white border-2 border-red-500 shadow-2xl flex flex-col items-center py-4 h-0 overflow-hidden z-[-1]">
               <div className="flex flex-col items-center gap-1 text-red-600 font-extrabold text-2xl">
                 <span className="text-yellow-500 bg-red-600 px-1 rounded-sm mb-1 text-xl">祝</span><span>し</span><span>ん</span><span>き</span><span>ろ</span><span>く</span>
               </div>
            </div>
          </div>
        </div>
        <div className="absolute bottom-10 text-gray-600 bg-white/80 px-6 py-2 rounded-full font-bold animate-pulse drop-shadow-md">画面をタップしてスキップ</div>
      </div>
    );

    const ClockSVG = ({ h, m, size = 160 }) => {
      const hourAngle = (h % 12) * 30 + m * 0.5;
      const minuteAngle = m * 6;
      return (
        <svg width={size} height={size} viewBox="0 0 100 100" className="mx-auto my-2 overflow-visible bg-white rounded-full p-1 border stroke-gray-700 shadow-sm">
          <circle cx="50" cy="50" r="48" fill="white" stroke="#374151" strokeWidth="3" />
          {Array.from({length: 12}).map((_, i) => {
            const angle = (i + 1) * 30 * (Math.PI / 180);
            const x = 50 + 36 * Math.sin(angle); const y = 50 - 36 * Math.cos(angle);
            return <text key={i} x={x} y={y} dominantBaseline="middle" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#374151" transform={`translate(0, 1)`}>{i + 1}</text>
          })}
          {Array.from({length: 60}).map((_, i) => {
            if (i % 5 === 0) return null;
            const angle = i * 6 * (Math.PI / 180);
            return <line key={i} x1={50 + 44 * Math.sin(angle)} y1={50 - 44 * Math.cos(angle)} x2={50 + 47 * Math.sin(angle)} y2={50 - 47 * Math.cos(angle)} stroke="#9ca3af" strokeWidth="1" />
          })}
          <line x1="50" y1="50" x2={50 + 23 * Math.sin(hourAngle * Math.PI / 180)} y2={50 - 23 * Math.cos(hourAngle * Math.PI / 180)} stroke="#ef4444" strokeWidth="4" strokeLinecap="round" />
          <line x1="50" y1="50" x2={50 + 40 * Math.sin(minuteAngle * Math.PI / 180)} y2={50 - 40 * Math.cos(minuteAngle * Math.PI / 180)} stroke="#3b82f6" strokeWidth="3" strokeLinecap="round" />
          <circle cx="50" cy="50" r="3" fill="#374151" />
        </svg>
      );
    };

    const TimeLineSVG = ({ h1, m1, ansH, ansM, dm, dh, isAfter, isDuration, h2, m2, size = 100 }) => {
      let startHour = h1;
      if (!isAfter && !isDuration) {
        startHour = h1 - 2;
        if (startHour <= 0) startHour += 12;
      }
      const width = 600;
      const height = size;
      const padX = 60;
      const usableWidth = width - padX * 2;
      const pixelsPerHour = usableWidth / 3;

      const getX = (h, m) => {
        let diff = h - startHour;
        if (diff < -6) diff += 12;
        if (diff > 6) diff -= 12;
        const total = diff + m / 60;
        return padX + total * pixelsPerHour;
      };

      const ticks = [];
      for (let i = 0; i <= 3; i++) {
        const hr = (startHour + i) % 12 === 0 ? 12 : (startHour + i) % 12;
        ticks.push({ x: padX + i * pixelsPerHour, label: `${hr}時`, isMajor: true });
        if (i < 3) {
          for (let j = 1; j <= 5; j++) {
            ticks.push({ x: padX + i * pixelsPerHour + (pixelsPerHour / 6) * j, isMajor: false });
          }
        }
      }

      const x1 = getX(h1, m1);
      const x2 = isDuration ? getX(h2, m2) : getX(ansH, ansM);

      return (
        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="mx-auto my-2 overflow-visible bg-white rounded-xl p-2 border shadow-sm max-w-lg">
          <line x1={padX - 25} y1="60" x2={width - padX + 25} y2="60" stroke="#4b5563" strokeWidth="3" strokeLinecap="round" />
          {ticks.map((t, idx) => (
            <g key={idx}>
              <line x1={t.x} y1={t.isMajor ? "48" : "54"} x2={t.x} y2="66" stroke="#4b5563" strokeWidth={t.isMajor ? "2.5" : "1"} />
              {t.isMajor && (
                <text x={t.x} y="85" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#374151">{t.label}</text>
              )}
            </g>
          ))}
          {isDuration ? (
            <g>
              <circle cx={x1} cy="60" r="5" fill="#3b82f6" />
              <text x={x1} y="32" textAnchor="middle" fontSize="12" fill="#3b82f6" fontWeight="bold">{h1}:{m1.toString().padStart(2, '0')}</text>
              <circle cx={x2} cy="60" r="5" fill="#10b981" />
              <text x={x2} y="32" textAnchor="middle" fontSize="12" fill="#10b981" fontWeight="bold">{h2}:{m2.toString().padStart(2, '0')}</text>
              <path d={`M ${x1},50 Q ${(x1 + x2)/2},20 ${x2},50`} fill="none" stroke="#f59e0b" strokeWidth="3" strokeDasharray="4" />
              <text x={(x1 + x2)/2} y="15" textAnchor="middle" fontSize="14" fill="#f59e0b" fontWeight="bold">？ 時間 ？ 分</text>
            </g>
          ) : (
            <g>
              <circle cx={x1} cy="60" r="5" fill="#3b82f6" />
              <text x={x1} y="32" textAnchor="middle" fontSize="12" fill="#3b82f6" fontWeight="bold">{h1}時{m1}分</text>
              <path d={isAfter ? `M ${x1},50 Q ${(x1 + x2)/2},32 ${x2 - 5},46` : `M ${x1},50 Q ${(x1 + x2)/2},32 ${x2 + 5},46`} fill="none" stroke="#ef4444" strokeWidth="3" />
              {isAfter ? (
                <polygon points={`${x2},48 ${x2-8},38 ${x2-4},50`} fill="#ef4444" />
              ) : (
                <polygon points={`${x2},48 ${x2+8},38 ${x2+4},50`} fill="#ef4444" />
              )}
              <text x={(x1 + x2)/2} y="24" textAnchor="middle" fontSize="12" fill="#ef4444" fontWeight="bold">
                {dh > 0 ? `${dh}時間` : ''}{dm}分{isAfter ? '後' : '前'}
              </text>
              <circle cx={x2} cy="60" r="5" fill="#ef4444" />
              <text x={x2} y="32" textAnchor="middle" fontSize="15" fill="#ef4444" fontWeight="bold">？</text>
            </g>
          )}
        </svg>
      );
    };

    const NumberLineSVG = ({ labels, count }) => {
      return (
        <svg width="100%" height="140" viewBox="0 0 1000 140" className="mx-auto my-4 overflow-visible max-w-xl">
          <line x1="40" y1="50" x2="960" y2="50" stroke="#374151" strokeWidth="4" strokeLinecap="round" />
          <polygon points="960,42 980,50 960,58" fill="#374151" />
          {labels && labels.map((label, j) => {
            const x = 80 + (840 / (count - 1)) * j;
            return (
              <g key={j}>
                <line x1={x} y1="35" x2={x} y2="65" stroke="#374151" strokeWidth="3" strokeLinecap="round" />
                {typeof label === 'object' ? (
                  label.int > 0 ? (
                    <g>
                      <text x={x - 18} y="100" textAnchor="middle" fontSize="26" fontWeight="bold" fill="#1f2937">{label.int}</text>
                      <text x={x + 12} y="88" textAnchor="middle" fontSize="20" fontWeight="bold" fill="#1f2937">{label.num}</text>
                      <line x1={x} y1="94" x2={x + 24} y2="94" stroke="#1f2937" strokeWidth="2" />
                      <text x={x + 12} y="114" textAnchor="middle" fontSize="20" fontWeight="bold" fill="#1f2937">{label.den}</text>
                    </g>
                  ) : (
                    <g>
                      <text x={x} y="88" textAnchor="middle" fontSize="20" fontWeight="bold" fill="#1f2937">{label.num}</text>
                      <line x1={x - 12} y1="94" x2={x + 12} y2="94" stroke="#1f2937" strokeWidth="2" />
                      <text x={x} y="114" textAnchor="middle" fontSize="20" fontWeight="bold" fill="#1f2937">{label.den}</text>
                    </g>
                  )
                ) : (
                  <text x={x} y="100" textAnchor="middle" fontSize={label === '?' ? "36" : "26"} fontWeight="bold" fill={label === '?' ? "#ef4444" : "#1f2937"}>
                    {label === '?' ? '？' : label}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      );
    };

    const saveRecord = (type, level, mode, value, resultValue) => {
      const records = JSON.parse(localStorage.getItem('sansu_records') || '{}');
      if (!records[type]) records[type] = {};
      if (!records[type][level]) records[type][level] = {};
      
      const key = `${mode}_${value}`;
      const currentBest = records[type][level][key];
      let isNewRecord = false;

      if (mode === 'count') {
        if (currentBest === undefined || resultValue < currentBest) {
          records[type][level][key] = resultValue;
          isNewRecord = true;
        }
      } else if (mode === 'time') {
        if (currentBest === undefined || resultValue > currentBest) {
          records[type][level][key] = resultValue;
          isNewRecord = true;
        }
      }
      localStorage.setItem('sansu_records', JSON.stringify(records));
      return isNewRecord; 
    };

    const checkAndApplyAllClearBonus = (type, level) => {
      const records = JSON.parse(localStorage.getItem('sansu_records') || '{}');
      if (!records[type] || !records[type][level]) return 0;
      
      const currentLevelRecords = records[type][level];
      if (currentLevelRecords.all_cleared) return 0; 

      const requiredKeys = ['count_10', 'count_20', 'count_30', 'time_60', 'time_120', 'time_180'];
      const hasAll = requiredKeys.every(key => currentLevelRecords[key] !== undefined);
      
      if (hasAll) {
        currentLevelRecords.all_cleared = true;
        localStorage.setItem('sansu_records', JSON.stringify(records));
        return level * 100; 
      }
      return 0;
    };

    const addPoints = (type, level, mode, value, pointsToAdd) => {
      const records = JSON.parse(localStorage.getItem('sansu_records') || '{}');
      if (!records[type]) records[type] = {};
      if (!records[type][level]) records[type][level] = {};
      
      const key = `${mode}_${value}_points`;
      const currentPoints = records[type][level][key] || 0;
      
      records[type][level][key] = currentPoints + pointsToAdd;
      localStorage.setItem('sansu_records', JSON.stringify(records));
    };

    const saveMistake = (type, problem) => {
      const mistakes = JSON.parse(localStorage.getItem('sansu_mistakes') || '{}');
      if (!mistakes[type]) mistakes[type] = {};
      
      let key;
      if (problem.op === '数直線') {
        key = `${problem.n1}_${problem.op}_${problem.n2}_${problem.missingIndex}`;
      } else if (problem.op === '長さ') {
        key = `length_${problem.ansTotalMm}`;
      } else if (problem.op === '単位') {
        key = `unit_${problem.answerType}_${problem.q_total_small || problem.q_total_cm}_${problem.q_large || problem.q_m}_${problem.q_small || problem.q_cm}_${problem.unitType || 'length'}`;
      } else if (problem.op === '文章問題') {
        key = `word_${problem.ans}_${problem.text.length}`;
      } else if (problem.op === 'がい数') {
        if (problem.answerType === 'approx_range') {
          key = `approx_range_${problem.ans1}_${problem.ans2}`;
        } else {
          key = `approx_${problem.n1}_${problem.ans}`;
        }
      } else if (problem.op === '時刻と時間') {
        key = `clock_${problem.answerType}_${problem.ans1}_${problem.ans2}_${problem.text.length}`;
      } else {
        key = `${problem.n1}_${problem.op}_${problem.n2}`;
      }
      
      if (!mistakes[type][key]) {
        mistakes[type][key] = { 
          n1: problem.n1, op: problem.op, n2: problem.n2, 
          missingIndex: problem.missingIndex, 
          ansCm: problem.ansCm, ansMm: problem.ansMm, ansTotalMm: problem.ansTotalMm,
          answerType: problem.answerType,
          q_large: problem.q_large, q_small: problem.q_small, q_total_small: problem.q_total_small, 
          ans1: problem.ans1, ans2: problem.ans2,
          unitType: problem.unitType, unitLarge: problem.unitLarge, unitSmall: problem.unitSmall,
          text: problem.text, equation: problem.equation,
          count: 0 
        };
      }
      mistakes[type][key].count += 1;
      localStorage.setItem('sansu_mistakes', JSON.stringify(mistakes));
    };

    const generateSingleProblemLocal = (type, level) => {
      let n1, n2, ans;
      switch (type) {
        case 'add':
          if (level === 1) { n1 = Math.floor(Math.random() * 9) + 1; n2 = Math.floor(Math.random() * (10 - n1)) + 1; }
          else if (level === 2) { n1 = Math.floor(Math.random() * 8) + 2; n2 = Math.floor(Math.random() * (9 - (11 - n1) + 1)) + (11 - n1); }
          else if (level === 3) { n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 9) + 1; }
          else if (level === 4) { n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 90) + 10; }
          else { n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.random() < 0.5 ? Math.floor(Math.random() * 90) + 10 : Math.floor(Math.random() * 900) + 100; }
          ans = n1 + n2; return { n1, n2, op: '+', ans };
        case 'sub':
          if (level === 1) { n1 = Math.floor(Math.random() * 9) + 2; n2 = Math.floor(Math.random() * (n1 - 1)) + 1; }
          else if (level === 2) { n1 = Math.floor(Math.random() * 10) + 11; n2 = Math.floor(Math.random() * 9) + 1; }
          else if (level === 3) { n1 = Math.floor(Math.random() * 79) + 21; n2 = Math.floor(Math.random() * (n1 - 10)) + 10; }
          else if (level === 4) { n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.floor(Math.random() * 90) + 10; }
          else { n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.floor(Math.random() * (n1 - 100)) + 100; }
          ans = n1 - n2; return { n1, n2, op: '-', ans };
        case 'mul':
          if (level === 1) { n1 = Math.floor(Math.random() * 9) + 1; n2 = Math.floor(Math.random() * 9) + 1; }
          else if (level === 2) { const r = Math.random(); if (r < 0.15) { n1 = 0; n2 = Math.floor(Math.random() * 9) + 1; } else if (r < 0.3) { n1 = Math.floor(Math.random() * 9) + 1; n2 = 0; } else { n1 = Math.floor(Math.random() * 11) + 1; n2 = Math.floor(Math.random() * 10) + 1; } }
          else if (level === 3) { n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 8) + 2; }
          else if (level === 4) { n1 = Math.floor(Math.random() * 90) + 10; n2 = Math.floor(Math.random() * 90) + 10; }
          else { n1 = Math.floor(Math.random() * 900) + 100; n2 = Math.floor(Math.random() * 90) + 10; }
          ans = n1 * n2; return { n1, n2, op: '×', ans };
        case 'div':
          if (level === 1) { n2 = Math.floor(Math.random() * 9) + 1; ans = Math.floor(Math.random() * 9) + 1; n1 = n2 * ans; return { n1, n2, op: '÷', ans }; }
          else if (level === 2) { n2 = Math.floor(Math.random() * 8) + 2; const rem = Math.floor(Math.random() * (n2 - 1)) + 1; ans = Math.floor(Math.random() * 9) + 1; n1 = n2 * ans + rem; return { n1, n2, op: '÷', ans, rem }; }

    const DrawCanvas = forwardRef(({ clearKey }, ref) => {
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);
      const [size, setSize] = useState({ width: 0, height: 0 });
      const pathsRef = useRef([]);
      const currentPathRef = useRef(null);

      const redraw = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#4b5563';

        pathsRef.current.forEach(path => {
          if (path.points.length === 0) return;
          ctx.beginPath();
          ctx.moveTo(path.points[0].x, path.points[0].y);
          for (let i = 1; i < path.points.length; i++) {
            ctx.lineTo(path.points[i].x, path.points[i].y);
          }
          ctx.stroke();
        });
      }, []);

      useImperativeHandle(ref, () => ({
        clear: () => { pathsRef.current = []; redraw(); },
        undo: () => { pathsRef.current.pop(); redraw(); }
      }));

      useEffect(() => {
        const updateSize = () => {
          if (canvasRef.current && canvasRef.current.parentElement) {
            const parent = canvasRef.current.parentElement;
            setSize({ width: parent.clientWidth, height: parent.clientHeight });
          }
        };
        updateSize();
        const timer = setTimeout(updateSize, 100);
        window.addEventListener('resize', updateSize);
        return () => { clearTimeout(timer); window.removeEventListener('resize', updateSize); };
      }, []);

      useEffect(() => { pathsRef.current = []; redraw(); }, [clearKey, size, redraw]);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };

      const startDrawing = (e) => {
        if (e.cancelable) e.preventDefault();
        isDrawing.current = true;
        const coords = getCoordinates(e);
        currentPathRef.current = { points: [coords] };
        pathsRef.current.push(currentPathRef.current);
        redraw();
      };

      const draw = (e) => {
        if (!isDrawing.current || !currentPathRef.current) return;
        if (e.cancelable) e.preventDefault();
        const coords = getCoordinates(e);
        currentPathRef.current.points.push(coords);
        redraw();
      };

      const stopDrawing = () => { isDrawing.current = false; currentPathRef.current = null; };

      return (
        <canvas
          ref={canvasRef}
          width={size.width}
          height={size.height}
          className="absolute inset-0 touch-none cursor-crosshair z-10"
          onMouseDown={startDrawing}
          onMouseMove={draw}
          onMouseUp={stopDrawing}
          onMouseLeave={stopDrawing}
          onTouchStart={startDrawing}
          onTouchMove={draw}
          onTouchEnd={stopDrawing}
          onTouchCancel={stopDrawing}
        />
      );
    });

            <div className="text-lg md:text-xl font-bold text-gray-700">{theme.title} <span className="text-sm text-gray-500">Lv.{level}</span></div>
            <div className="flex items-center gap-2 md:gap-4">
              <div className="flex text-red-400">{[...Array(3)].map((_, i) => <Heart key={i} className={`w-5 h-5 ${i < 3 - mistakes ? 'fill-current' : 'text-gray-200'}`} />)}</div>
              <div className="flex items-center gap-1 font-bold text-yellow-500 text-xl bg-yellow-50 px-3 py-1 rounded-full">
                <Star className="w-6 h-6 fill-current inline-block" /> {course.mode === 'count' ? `${score}/${course.value}` : score}
              </div>
            </div>
          </div>

          <div className="flex-1 relative flex flex-col w-full">
            {countdown !== null && (
              <div className="fixed inset-0 bg-white/80 backdrop-blur-sm z-[60] flex flex-col items-center justify-center">
                <div key={countdown} className="text-8xl sm:text-9xl md:text-[200px] font-extrabold text-orange-500 animate-in zoom-in duration-300">
                  {countdown === 3 ? '３' : countdown === 2 ? '２' : '１'}
                </div>
              </div>
            )}

            <div className="w-full flex-1 bg-white sm:rounded-t-3xl shadow-lg relative flex flex-col">
              {/* テキスト指示の表示エリア */}
              {(isWordProblem || isApprox || isUnit || isNumberLine) && (
                <div className={`w-full p-4 sm:p-8 z-20 shrink-0 border-b-4 ${isWordProblem ? 'bg-indigo-50 border-indigo-100' : isUnit ? 'bg-cyan-50 border-cyan-100' : isNumberLine ? 'bg-pink-50 border-pink-100' : 'bg-orange-50 border-orange-100'}`}>
                  <div className={`text-xl sm:text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed whitespace-pre-wrap text-left w-full max-w-4xl mx-auto border-l-4 pl-4 bg-white p-4 rounded-r-xl shadow-sm ${isWordProblem ? 'border-indigo-400' : isUnit ? 'border-cyan-400' : isNumberLine ? 'border-pink-400' : 'border-orange-400'}`}>
                    {problem.text}
                  </div>
                </div>
              )}

              <div className="w-full flex flex-row relative min-h-[600px]">
                <div className={`flex flex-col items-center justify-start p-2 sm:p-4 bg-white z-10 pb-24 ${hasRightPanel ? 'w-1/2 border-r-2 border-gray-100' : 'w-full'}`}>
                  {status === 'correct' && <div className="absolute top-16 z-30"><Circle className="w-24 h-24 sm:w-32 sm:h-32 text-green-500/80 inline-block" strokeWidth={3} /></div>}
                  {status === 'wrong' && <div className="absolute top-16 z-30"><X className="w-24 h-24 sm:w-32 sm:h-32 text-red-500/80 inline-block" strokeWidth={3} /></div>}

                  {isClock && (
                    <div className="w-full flex flex-col items-center p-2">
                      <span className="text-xl sm:text-2xl font-bold text-gray-800 mb-4">{problem.text}</span>
                      <button onClick={() => setShowHint(prev => !prev)} className="mb-4 px-6 py-2 rounded-2xl font-bold bg-amber-400 text-white shadow-sm">💡 {showHint ? 'ヒントを かくす' : 'ヒントを みる'}</button>
                      {showHint && (
                        <div className="w-full flex justify-center">
                          {problem.answerType === 'clock_read' ? <ClockSVG h={problem.h1} m={problem.m1} size={150} /> : <TimeLineSVG h1={problem.h1} m1={problem.m1} ansH={problem.ans1} ansM={problem.ans2} dm={problem.dm} dh={problem.dh} isAfter={problem.isAfter} isDuration={problem.answerType === 'duration'} h2={problem.h2} m2={problem.m2} />}
                        </div>
                      )}
                    </div>
                  )}

                  {!isClock && !hasRightPanel && (
                    <div className="w-full text-xl sm:text-2xl font-bold text-center mt-4">
                      {isNumberLine && <NumberLineSVG labels={problem.labels} count={problem.count} />}
                      {isLength && <RulerSVG totalMm={problem.ansTotalMm} maxCm={problem.maxCm} />}
                    </div>
                  )}

                  {hasRightPanel && <div className="text-5xl md:text-7xl font-bold text-center mt-8 tracking-widest">{problem.n1} {problem.op} {problem.n2} = </div>}

                  <div className="flex justify-center items-end gap-2 mt-8">
                    {problem.answerType === 'integer' || problem.answerType === 'decimal' || (!problem.answerType && !isLength && !isUnit && !isWordProblem && !isApprox && !isClock && !isNumberLine) ? (
                       <div onClick={() => setFocusedInput('ans')} className={`w-32 h-24 bg-gray-100 rounded-2xl flex items-center justify-center text-5xl font-bold border-4 ${focusedInput === 'ans' ? 'border-orange-400' : ''}`}>{userInput || '?'}</div>
                    ) : problem.answerType === 'fraction_proper' || problem.answerType === 'fraction_improper' ? (
                       <div className="flex flex-col items-center gap-2">
                         <div onClick={() => setFocusedInput('num')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'num' ? 'border-orange-400' : ''}`}>{userInputNum || '?'}</div>
                         <div className="w-28 h-1.5 bg-gray-800 rounded-full"></div>
                         <div onClick={() => setFocusedInput('den')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'den' ? 'border-orange-400' : ''}`}>{userInputDen || '?'}</div>
                       </div>
                    ) : problem.answerType === 'fraction_mixed' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('int')} className={`w-24 h-32 bg-gray-100 rounded-xl flex items-center justify-center text-5xl font-bold border-4 ${focusedInput === 'int' ? 'border-orange-400' : ''}`}>{userInputInt || '?'}</div>
                         <div className="flex flex-col items-center gap-2">
                           <div onClick={() => setFocusedInput('num')} className={`w-20 h-14 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'num' ? 'border-orange-400' : ''}`}>{userInputNum || '?'}</div>
                           <div className="w-24 h-1.5 bg-gray-800 rounded-full"></div>
                           <div onClick={() => setFocusedInput('den')} className={`w-20 h-14 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'den' ? 'border-orange-400' : ''}`}>{userInputDen || '?'}</div>
                         </div>
                       </div>
                    ) : problem.answerType === 'length_cm' ? (
                       <div className="flex items-center gap-2">
                         <div onClick={() => setFocusedInput('cm')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'cm' ? 'border-orange-400' : ''}`}>{userInputCm || '?'}</div>
                         <span className="text-2xl sm:text-4xl font-bold text-gray-800">cm</span>
                       </div>
                    ) : problem.answerType === 'length_mm' ? (
                       <div className="flex items-center gap-2">
                         <div onClick={() => setFocusedInput('mm')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'mm' ? 'border-orange-400' : ''}`}>{userInputMm || '?'}</div>
                         <span className="text-2xl sm:text-4xl font-bold text-gray-800">mm</span>
                       </div>
                    ) : problem.answerType === 'length_cm_mm' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('cm')} className={`w-20 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'cm' ? 'border-orange-400' : ''}`}>{userInputCm || '?'}</div>
                         <span className="text-xl font-bold">cm</span>
                         <div onClick={() => setFocusedInput('mm')} className={`w-20 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'mm' ? 'border-orange-400' : ''}`}>{userInputMm || '?'}</div>
                         <span className="text-xl font-bold">mm</span>
                       </div>
                    ) : problem.answerType === 'unit_large' ? (
                       <div className="flex items-center gap-2">
                         <div onClick={() => setFocusedInput('unit1')} className={`w-32 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'unit1' ? 'border-orange-400' : ''}`}>{userInputUnit1 || '?'}</div>
                         <span className="text-2xl sm:text-4xl font-bold text-gray-800">{problem.unitLarge}</span>
                       </div>
                    ) : problem.answerType === 'unit_small' || problem.answerType === 'unit_small_from_composite' ? (
                       <div className="flex items-center gap-2">
                         <div onClick={() => setFocusedInput('unit1')} className={`w-32 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-4xl font-bold border-4 ${focusedInput === 'unit1' ? 'border-orange-400' : ''}`}>{userInputUnit1 || '?'}</div>
                         <span className="text-2xl sm:text-4xl font-bold text-gray-800">{problem.unitSmall}</span>
                       </div>
                    ) : problem.answerType === 'unit_composite_from_small' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('unit1')} className={`w-20 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit1' ? 'border-orange-400' : ''}`}>{userInputUnit1 || '?'}</div>
                         <span className="text-xl font-bold">{problem.unitLarge}</span>
                         <div onClick={() => setFocusedInput('unit2')} className={`w-20 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit2' ? 'border-orange-400' : ''}`}>{userInputUnit2 || '?'}</div>
                         <span className="text-xl font-bold">{problem.unitSmall}</span>
                       </div>
                    ) : problem.answerType === 'approx_range' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('approx1')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'approx1' ? 'border-orange-400' : ''}`}>{userInputApprox1 || '?'}</div>
                         <span className="text-lg font-bold">以上</span>
                         <div onClick={() => setFocusedInput('approx2')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'approx2' ? 'border-orange-400' : ''}`}>{userInputApprox2 || '?'}</div>
                         <span className="text-lg font-bold">未満</span>
                       </div>
                    ) : problem.answerType === 'clock' || problem.answerType === 'clock_read' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('unit1')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit1' ? 'border-orange-400' : ''}`}>{userInputUnit1 || '?'}</div>
                         <span className="text-xl font-bold">時</span>
                         <div onClick={() => setFocusedInput('unit2')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit2' ? 'border-orange-400' : ''}`}>{userInputUnit2 || '?'}</div>
                         <span className="text-xl font-bold">分</span>
                       </div>
                    ) : problem.answerType === 'duration' ? (
                       <div className="flex items-center gap-3">
                         <div onClick={() => setFocusedInput('unit1')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit1' ? 'border-orange-400' : ''}`}>{userInputUnit1 || '?'}</div>
                         <span className="text-xl font-bold">時間</span>
                         <div onClick={() => setFocusedInput('unit2')} className={`w-24 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-3xl font-bold border-4 ${focusedInput === 'unit2' ? 'border-orange-400' : ''}`}>{userInputUnit2 || '?'}</div>
                         <span className="text-xl font-bold">分</span>
                       </div>
                    ) : null}
                  </div>

                  {currentProblemMistakes >= 2 && status !== 'correct' && (
                    <div className="mt-6 p-4 bg-red-50 border-4 border-red-300 rounded-2xl w-full max-w-md text-center">
                      <span className="text-sm font-bold text-red-800 block">せいかいは コレだよ！</span>
                      <div className="text-3xl font-extrabold text-red-600">{renderCorrectAnswer(problem)}</div>
                    </div>
                  )}

                  {/* Keypad */}
                  <div className="mt-6 w-full max-w-md grid grid-cols-3 gap-3">
                    {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                      <button key={num} onClick={() => handleInput(num.toString())} className="bg-white text-2xl font-bold py-4 rounded-2xl shadow-[0_4px_0_#e5e7eb] active:translate-y-[4px]">{num}</button>
                    ))}
                    <button onClick={handleDelete} className="bg-gray-200 text-lg font-bold py-4 rounded-2xl">けす</button>
                    <button onClick={() => handleInput('0')} className="bg-white text-2xl font-bold py-4 rounded-2xl shadow-[0_4px_0_#e5e7eb] active:translate-y-[4px]">0</button>
                    <button onClick={handleCheck} className="col-span-3 bg-orange-500 text-white text-2xl font-bold py-4 rounded-2xl shadow-[0_4px_0_#c2410c] active:translate-y-[4px]">こたえる</button>
                  </div>
                </div>

                {hasRightPanel && (
                  <div className="w-1/2 bg-amber-50 relative">
                    <div className="absolute top-4 right-4 flex gap-2 z-20">
                      <button onClick={() => canvasRef.current?.undo()} className="px-3 py-1 bg-white text-amber-700 rounded-lg font-bold text-sm shadow-sm"><Undo className="w-4 h-4 inline" /> もどる</button>
                      <button onClick={() => canvasRef.current?.clear()} className="px-3 py-1 bg-white text-amber-700 rounded-lg font-bold text-sm shadow-sm"><X className="w-4 h-4 inline" /> けす</button>
                    </div>
                    <GridBackground />
                    <VerticalMath problem={problem} />
                    <DrawCanvas ref={canvasRef} clearKey={clearKey} />
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ResultView = ({ result, type, setView }) => {
      const [showKusudama, setShowKusudama] = useState(result.isNewRecord && !result.isGameOver);
      const theme = getTheme(type);

      return (
        <div className={`flex flex-col items-center justify-center min-h-screen ${theme.bg} p-6`}>
          {showKusudama && <Kusudama onClick={() => setShowKusudama(false)} />}
          <div className={`bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg text-center border-4 ${theme.border}`}>
            {result.isGameOver ? (
              <React.Fragment>
                <X className="w-24 h-24 text-red-500 mx-auto mb-4" strokeWidth={3} />
                <h2 className="text-3xl font-extrabold text-red-500 mb-2">ざんねん…</h2>
                <p className="text-xl font-bold text-gray-700 mb-6">つぎは がんばろう！</p>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <Award className={`w-20 h-20 ${theme.text} mx-auto mb-4`} />
                <h2 className={`text-3xl font-extrabold ${theme.text} mb-2`}>おつかれさま！</h2>
                <div className="bg-gray-50 rounded-2xl p-6 mb-6">
                  <p className="text-2xl font-bold mb-4">{result.mode==='count'?`${result.value}問 せいかい！`:`${result.score} 問`}</p>
                  <p className="text-4xl font-extrabold">{result.mode==='count'?`${Math.floor(result.timeElapsed/60)}分${result.timeElapsed%60}秒`:`${result.value/60}分間`}</p>
                </div>
              </React.Fragment>
            )}

            {result.earnedPoints > 0 && (
              <div className="flex justify-center mb-6">
                 <div className="bg-yellow-100 border-2 border-yellow-300 text-yellow-700 px-6 py-2 rounded-full font-bold text-xl flex items-center gap-2">
                   <Star className="w-6 h-6 fill-yellow-500 text-yellow-500 inline-block" />
                   {result.earnedPoints} pt ゲット！
                 </div>
              </div>
            )}

            <div className="flex flex-col gap-4">
              <button onClick={() => setView('quiz')} className={`relative ${theme.btn} text-white text-xl font-bold py-4 rounded-2xl active:translate-y-[6px]`}>もう1回やる</button>
              <button onClick={() => setView('course')} className="bg-gray-200 text-gray-700 text-lg font-bold py-4 rounded-2xl shadow-[0_6px_0_#9ca3af] active:translate-y-[6px]">もどる</button>
            </div>
          </div>
        </div>
      );
    };

    const PrintView = ({ setView }) => {
      const [grade, setGrade] = useState(1);
      const [unit, setUnit] = useState('add');
      const [problems, setProblems] = useState([]);

      const generatePrint = useCallback(() => {
        const problemCount = ['add', 'sub', 'mul', 'div', 'unit'].includes(unit) ? 20 : 10;
        const newProbs = [];
        for(let i = 0; i < problemCount; i++) { newProbs.push(generateProblem(unit, grade)); }
        setProblems(newProbs);
      }, [grade, unit]);

      useEffect(() => { generatePrint(); }, [generatePrint]);

      return (
        <div className="min-h-screen bg-white">
          <div className="print:hidden p-4 bg-stone-100 border-b-4 border-stone-200 sticky top-0 z-50">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <button onClick={() => setView('home')} className="font-bold text-gray-600 flex items-center gap-2"><ArrowLeft className="w-5 h-5 inline-block"/> もどる</button>
              <div className="flex gap-3">
                <button onClick={generatePrint} className="bg-blue-500 text-white px-4 py-2 rounded-xl font-bold">問題をかえる</button>
                <button onClick={() => window.print()} className="bg-green-500 text-white px-4 py-2 rounded-xl font-bold">🖨️ 印刷する</button>
              </div>
            </div>
          </div>

          <div id="print-area" className="p-8 max-w-[210mm] mx-auto text-black bg-white">
            <h1 className="text-2xl font-bold border-b-2 border-black pb-1 mb-6">レベル{grade} さんすう プリント</h1>
            <div className="grid grid-cols-2 gap-x-8 gap-y-6 text-xl font-bold">
              {problems.map((p, i) => (
                <div key={i} className="flex gap-2">
                  <span>({i+1})</span>
                  <span>{p.text || `${p.n1} ${p.op} ${p.n2} = （　　）`}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [view, setView] = useState('home');
      const [type, setType] = useState('add');
      const [level, setLevel] = useState(1);
      const [course, setCourse] = useState({ mode: 'count', value: 10 });
      const [result, setResult] = useState(null);

      return (
        <div className="min-h-screen bg-gray-50 selection:bg-yellow-200 overflow-x-hidden">
          {view === 'home' && <HomeView setType={setType} setView={setView} />}
          {view === 'level' && <LevelView type={type} setView={setView} setLevel={setLevel} />}
          {view === 'course' && <CourseView type={type} level={level} setView={setView} setCourse={setCourse} />}
          {view === 'quiz' && <QuizView type={type} level={level} course={course} setView={setView} setResult={setResult} />}
          {view === 'result' && <ResultView result={result} type={type} level={level} setView={setView} />}
          {view === 'records' && <RecordsView setView={setView} />}
          {view === 'print' && <PrintView setView={setView} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
